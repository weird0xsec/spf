<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>Permission Origin Test</title>

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <style>

    body {
      margin: 0;
      padding: 24px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        system-ui,
        sans-serif;

      background: #f5f5f7;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: auto;

      background: white;

      padding: 24px;

      border-radius: 16px;

      box-shadow:
        0 10px 40px rgba(0,0,0,.12);
    }

    h1 {
      margin-top: 0;
    }

    button {
      appearance: none;

      border: 0;

      border-radius: 10px;

      padding: 12px 18px;

      background: #007aff;

      color: white;

      font-size: 15px;

      cursor: pointer;
    }

    button:active {
      opacity: .7;
    }

    pre {
      margin-top: 20px;

      padding: 15px;

      background: #111;

      color: #00ff66;

      border-radius: 10px;

      overflow: auto;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .info {
      background: #eef5ff;

      padding: 12px;

      border-radius: 10px;

      margin: 15px 0;
    }

    .frame {
      margin-top: 20px;

      border: 1px solid #ccc;

      border-radius: 10px;

      overflow: hidden;
    }

    iframe {
      display: block;

      width: 100%;

      height: 300px;

      border: 0;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>Geolocation Permission Test</h1>

  <div class="info">

    <strong>Current document origin:</strong>

    <br>

    <code id="origin"></code>

  </div>

  <button id="locationButton">
    Request Location
  </button>

  <pre id="output">Waiting...</pre>

  <hr>

  <h3>Nested permission.site frame</h3>

  <div class="frame">

    <iframe
      src="https://permission.site"
      allow="geolocation">
    </iframe>

  </div>

</div>


<script>

const originElement =
  document.getElementById("origin");

const output =
  document.getElementById("output");

const button =
  document.getElementById("locationButton");


/*
 * Display the actual security origin
 * of this document.
 */

originElement.textContent =
  location.origin;


/*
 * Request geolocation.
 */

function requestLocation() {

  output.textContent =
    "Requesting geolocation...\n\n" +

    "Document origin:\n" +

    location.origin +

    "\n\n" +

    "Top-level origin:\n" +

    getTopOrigin();


  if (!navigator.geolocation) {

    output.textContent +=
      "\n\nGeolocation API unavailable.";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      output.textContent =

        "PERMISSION GRANTED\n\n" +

        "Document origin:\n" +

        location.origin +

        "\n\n" +

        "Top-level origin:\n" +

        getTopOrigin() +

        "\n\n" +

        "Latitude:\n" +

        position.coords.latitude +

        "\n\n" +

        "Longitude:\n" +

        position.coords.longitude +

        "\n\n" +

        "Accuracy:\n" +

        position.coords.accuracy;

    },

    function(error) {

      output.textContent =

        "PERMISSION / GEOLOCATION ERROR\n\n" +

        "Document origin:\n" +

        location.origin +

        "\n\n" +

        "Top-level origin:\n" +

        getTopOrigin() +

        "\n\n" +

        "Error code:\n" +

        error.code +

        "\n\n" +

        "Error message:\n" +

        error.message;

    }

  );

}


/*
 * We intentionally don't attempt
 * to read cross-origin top.location.
 *
 * Instead, report whether this
 * document is running in a frame.
 */

function getTopOrigin() {

  try {

    return window.top === window
      ? location.origin
      : "Cross-origin top-level context";

  } catch (e) {

    return "Cross-origin top-level context";

  }

}


button.addEventListener(
  "click",
  requestLocation
);


/*
 * Listen for messages so that
 * cooperating test pages can report
 * their origin without collecting
 * location data.
 */

window.addEventListener(
  "message",
  function(event) {

    output.textContent +=

      "\n\npostMessage received from:\n" +

      event.origin;

  }
);

</script>

</body>
</html>
