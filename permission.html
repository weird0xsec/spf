<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>Permission Origin Test</title>

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <style>

    body {
      margin: 0;
      padding: 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        system-ui,
        sans-serif;

      background: #f5f5f7;
      text-align: center;
    }

    button {
      padding: 12px 20px;

      border: 0;
      border-radius: 10px;

      background: #007aff;
      color: white;

      font-size: 16px;
    }

    #output {
      margin: 25px auto;

      max-width: 600px;

      padding: 20px;

      background: white;

      border-radius: 12px;

      text-align: left;

      white-space: pre-wrap;

      word-break: break-word;
    }

  </style>

</head>

<body>

<h2>Geolocation Permission Test</h2>

<p>
  Current origin:
  <strong id="origin"></strong>
</p>

<button onclick="getLocation()">
  Request Location
</button>

<div id="output">
Waiting for permission...
</div>


<script>

const origin =
  document.getElementById("origin");

const output =
  document.getElementById("output");


origin.textContent =
  location.origin;


function notifyWebhook(eventName) {

  /*
   * Only send a non-sensitive event.
   * No latitude/longitude is transmitted.
   */

  fetch(
    "https://webhook.site/0154ce08-dd75-439e-bbc1-be94ac3515fb",
    {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({

        event: eventName,

        origin: location.origin,

        timestamp:
          new Date().toISOString()

      })
    }
  )
  .catch(function () {

    /*
     * Ignore webhook errors so the
     * permission test continues.
     */

  });

}


function getLocation() {

  if (!navigator.geolocation) {

    output.textContent =
      "Geolocation API unavailable.";

    return;
  }


  output.textContent =
    "Requesting geolocation permission...";


  navigator.geolocation.getCurrentPosition(

    function (position) {

      output.textContent =

        "PERMISSION GRANTED\n\n" +

        "Origin:\n" +
        location.origin +

        "\n\n" +

        "Location was successfully returned " +
        "to this document.\n\n" +

        "Coordinates are intentionally " +
        "not transmitted to the webhook.";

      notifyWebhook(
        "geolocation_permission_granted"
      );

    },


    function (error) {

      output.textContent =

        "PERMISSION DENIED / ERROR\n\n" +

        "Origin:\n" +
        location.origin +

        "\n\n" +

        "Code: " +
        error.code +

        "\n\n" +

        "Message: " +
        error.message;

      notifyWebhook(
        "geolocation_permission_denied"
      );

    }

  );

}

</script>

</body>
</html>
